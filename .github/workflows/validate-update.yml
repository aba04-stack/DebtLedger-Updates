name: Validate update manifest

on:
  push:
    branches: [ main ]
    paths:
      - update.json
      - RELEASE.md
      - README.md
      - .github/workflows/validate-update.yml
  pull_request:
    branches: [ main ]
    paths:
      - update.json
      - RELEASE.md
      - README.md
      - .github/workflows/validate-update.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(Path("update.json").read_text(encoding="utf-8"))
          required = ["enabled", "versionCode", "versionName", "apkUrl", "sha256", "mandatory", "notes"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing fields: {missing}")

          if not isinstance(data["enabled"], bool):\n              raise SystemExit("enabled must be boolean")\n          if not isinstance(data["versionCode"], int) or data["versionCode"] <= 0:
              raise SystemExit("versionCode must be a positive integer")
          if not isinstance(data["versionName"], str) or not data["versionName"].strip():
              raise SystemExit("versionName must be non-empty")
          if not isinstance(data["apkUrl"], str) or not data["apkUrl"].startswith("https://"):
              raise SystemExit("apkUrl must use HTTPS")
          if not re.fullmatch(r"[0-9a-fA-F]{64}", str(data["sha256"])):
              raise SystemExit("sha256 must be exactly 64 hexadecimal characters")
          if data["enabled"] and str(data["sha256"]).lower() == "0" * 64:\n              raise SystemExit("enabled manifest cannot use a zero SHA-256")\n          if not isinstance(data["mandatory"], bool):
              raise SystemExit("mandatory must be boolean")
          if not isinstance(data["notes"], str):
              raise SystemExit("notes must be a string")

          print(f"Validated update {data['versionName']} (versionCode {data['versionCode']})")
          print(f"APK: {data['apkUrl']}")
          PY

      - name: Validate release URL shape
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          data=json.load(open("update.json", encoding="utf-8"))
          expected=f"https://github.com/aba04-stack/DebtLedger-Updates/releases/download/v{data['versionName']}/DebtLedger-{data['versionName']}.apk"
          if data["apkUrl"] != expected:
              raise SystemExit(
                  "apkUrl must follow the canonical release layout: " + expected
              )
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", data["versionName"]):
              raise SystemExit("versionName must be semantic x.y.z")
          PY

      - name: Check HTTPS manifest
        shell: bash
        run: |
          test -s update.json
          python3 -m json.tool update.json >/dev/null
